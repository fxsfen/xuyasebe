<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ХУй Жопа ПиЗда</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d0f0c;
    --panel: #14170f;
    --line: #2a2f22;
    --ink: #e8e6d9;
    --dim: #8b8f7a;
    --green: #7fae52;
    --red: #b8563f;
    --amber: #c9a04a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Courier New', ui-monospace, monospace;
    padding: 20px 16px 60px;
    line-height: 1.4;
  }
  .masthead {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 12px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }
  .masthead h1 {
    font-size: 22px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0;
  }
  .masthead .date {
    color: var(--dim);
    font-size: 12px;
  }
  textarea {
    width: 100%;
    min-height: 140px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    padding: 10px;
    resize: vertical;
  }
  .input-block { margin-bottom: 12px; }
  .input-block label {
    display: block;
    font-size: 11px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .btn-row { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  button {
    background: var(--ink);
    color: var(--bg);
    border: none;
    font-family: inherit;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px 16px;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  button:active { opacity: 0.7; }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .stat {
    background: var(--panel);
    padding: 14px 12px;
  }
  .stat .label {
    font-size: 10px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .stat .value {
    font-size: 20px;
    font-weight: bold;
  }
  .stat .value.pos { color: var(--green); }
  .stat .value.neg { color: var(--red); }
  section {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 16px;
    margin-bottom: 16px;
  }
  section h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--dim);
    margin: 0 0 14px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }
  .chart-wrap { position: relative; height: 240px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
  td.amount-neg { color: var(--red); }
  td.amount-pos { color: var(--green); }
  .empty-note {
    color: var(--dim);
    font-size: 12px;
    text-align: center;
    padding: 20px 0;
  }
  .two-col { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 700px) {
    .two-col { grid-template-columns: 1fr 1fr; }
  }
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .tab-btn {
    background: transparent;
    color: var(--dim);
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .tab-btn.active {
    color: var(--ink);
    border-bottom: 2px solid var(--amber);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }
  .form-grid label {
    font-size: 10px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: block;
    margin-bottom: 4px;
  }
  .form-grid input, .form-grid select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    padding: 8px;
  }
  .full-span { grid-column: 1 / -1; }
</style>
</head>
<body>

<div class="masthead">
  <h1>ФИНАНСОВЫЙ ТРЕКЕР</h1>
  <div class="date" id="todayDate"></div>
</div>

<div class="tab-panel active" id="tabTracker">

<div class="input-block">
  <label>Данные из Apple Notes</label>
  <textarea id="rawInput" placeholder="25 июля 2026 г., 23:26|Расход|1|Еда|"></textarea>
</div>
<div class="btn-row">
  <button onclick="parseAndRender()">Разобрать</button>
  <button class="secondary" onclick="clearData()">Очистить всё</button>
</div>

<div class="input-block" id="monthSelectWrap" style="display:none;">
  <label>Месяц</label>
  <select id="monthSelect" onchange="onMonthChange()" style="width:100%; background:var(--panel); color:var(--ink); border:1px solid var(--line); font-family:inherit; font-size:13px; padding:10px;"></select>
</div>

<div class="stats" id="statsGrid"></div>

<div id="emptyState" class="empty-note" style="display:none;">Нет данных. Вставь текст заметки выше и нажми «Разобрать».</div>

<div id="content" style="display:none;">
  <div class="two-col">
    <section>
      <h2>Расходы по категориям</h2>
      <div class="chart-wrap"><canvas id="pieChart"></canvas></div>
    </section>
    <section>
      <h2>Доходы vs Расходы по дням</h2>
      <div class="chart-wrap"><canvas id="barChart"></canvas></div>
    </section>
  </div>

  <section>
    <h2>Баланс нарастающим итогом (с самого начала)</h2>
    <div class="chart-wrap"><canvas id="lineChart"></canvas></div>
  </section>

  <section>
    <h2>Все записи</h2>
    <table>
      <thead><tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Категория</th><th>Комментарий</th></tr></thead>
      <tbody id="recordsBody"></tbody>
    </table>
  </section>
</div>

</div>
<script>
let charts = {};
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

const STORAGE_KEY = 'grossbukh_raw_v1';

window.onload = async () => {
  let trackerText = '';

  // Основной транспорт: Shortcut передаёт данные после #.
  // Hash не отправляется GitHub Pages — его читает только JavaScript в браузере.
  const hashData = window.location.hash.replace(/^#/, '');
  if (hashData) {
    try {
      trackerText = decodeURIComponent(hashData);
    } catch (e) {
      trackerText = hashData;
    }
    document.getElementById('rawInput').value = trackerText;
    localStorage_safe_set(trackerText);
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }

  // Резерв: если ссылка открыта без hash — берём последнюю историю из браузера.
  if (!trackerText) {
    const saved = localStorage_safe_get();
    if (saved) {
      trackerText = saved;
      document.getElementById('rawInput').value = trackerText;
    }
  }

  if (trackerText) parseAndRender();
};

function localStorage_safe_get() {
  try { return localStorage.getItem(STORAGE_KEY) || ''; } catch(e) { return ''; }
}
function localStorage_safe_set(val) {
  try { localStorage.setItem(STORAGE_KEY, val); } catch(e) {}
}

// Если Safari уже держит страницу открытой и Shortcut открыл новый hash,
// обновляем данные без необходимости вручную обновлять страницу.
window.addEventListener('hashchange', () => {
  const data = window.location.hash.replace(/^#/, '');
  if (!data) return;
  let text = data;
  try { text = decodeURIComponent(data); } catch(e) {}
  document.getElementById('rawInput').value = text;
  localStorage_safe_set(text);
  parseAndRender();
  history.replaceState(null, '', window.location.pathname + window.location.search);
});


// ---------- SHORTCUTS BRIDGE ----------
// Shortcuts can call this page with:
// runShortcutData(TEXT_FROM_APPLE_NOTES)
function runShortcutData(text) {
  if (typeof text !== 'string') {
    text = String(text ?? '');
  }

  document.getElementById('rawInput').value = text;
  localStorage_safe_set(text);
  parseAndRender();

  return 'OK';
}

function parseRuDate(str) {
  // Устойчиво к любым вариантам форматирования Apple: "25 июля 2026 г., 23:26",
  // "1 авг. 2026 г., 15:28", и любым будущим сокращениям — сопоставляем по началу слова
  const monthRoots = [
    ['сентября', 8], ['сент', 8],
    ['февраля', 1], ['февр', 1],
    ['декабря', 11], ['дек', 11],
    ['января', 0], ['янв', 0],
    ['августа', 7], ['авг', 7],
    ['апреля', 3], ['апр', 3],
    ['ноября', 10], ['нояб', 10], ['ноя', 10],
    ['октября', 9], ['окт', 9],
    ['марта', 2], ['мар', 2],
    ['июня', 5], ['июн', 5],
    ['июля', 6], ['июл', 6],
    ['мая', 4], ['май', 4]
  ]; // отсортировано от самых длинных корней к коротким, чтобы избежать ложных совпадений (напр. "март" не спутать с "мая")

  const m = str.match(/(\d{1,2})\s+([а-яё]+)\.?\s+(\d{4})\s*г?\.?,?\s*(\d{1,2}):(\d{2})/i);
  if (!m) return null;
  const [, day, monthNameRaw, year, hh, mm] = m;
  const monthLower = monthNameRaw.toLowerCase();
  const found = monthRoots.find(([root]) => monthLower.startsWith(root));
  if (!found) return null;
  const monthIdx = found[1];
  return new Date(parseInt(year), monthIdx, parseInt(day), parseInt(hh), parseInt(mm));
}

function parseAndRender() {
  const raw = document.getElementById('rawInput').value;
  localStorage_safe_set(raw);

  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  const records = [];

  for (const line of lines) {
    const parts = line.split('|');
    if (parts.length < 4) continue;
    const [dateStr, type, amountStr, category, comment] = parts;
    const date = parseRuDate(dateStr);
    const amount = parseFloat(amountStr.replace(',', '.'));
    if (!date || isNaN(amount)) continue;
    records.push({
      date, dateRaw: dateStr.trim(),
      type: type.trim(),
      amount,
      category: category.trim() || '—',
      comment: (comment || '').trim()
    });
  }

  if (records.length === 0) {
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('content').style.display = 'none';
    document.getElementById('monthSelectWrap').style.display = 'none';
    document.getElementById('statsGrid').innerHTML = '';
    return;
  }

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  records.sort((a,b) => a.date - b.date);
  allRecords = records;

  populateMonthSelector(records);
  renderForSelectedMonth();
}

const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
let allRecords = [];

function monthKey(date) {
  return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0');
}

function populateMonthSelector(records) {
  const keys = [...new Set(records.map(r => monthKey(r.date)))].sort();
  const select = document.getElementById('monthSelect');
  const prevValue = select.value;
  select.innerHTML = '<option value="all">Все месяцы</option>' + keys.map(k => {
    const [y, m] = k.split('-');
    return `<option value="${k}">${monthNames[parseInt(m)-1]} ${y}</option>`;
  }).join('');

  document.getElementById('monthSelectWrap').style.display = 'block';

  // По умолчанию выбираем последний месяц, если не было выбора раньше
  if (prevValue && [...select.options].some(o => o.value === prevValue)) {
    select.value = prevValue;
  } else if (keys.length > 0) {
    select.value = keys[keys.length - 1];
  }
}

function onMonthChange() {
  renderForSelectedMonth();
}

function renderForSelectedMonth() {
  const selected = document.getElementById('monthSelect').value;
  const filtered = selected === 'all'
    ? allRecords
    : allRecords.filter(r => monthKey(r.date) === selected);

  // Общий баланс всегда считается по ВСЕЙ истории до конца выбранного месяца (или по всей истории, если выбраны "Все месяцы")
  let balanceRecords = allRecords;
  if (selected !== 'all') {
    const [y, m] = selected.split('-').map(Number);
    const endOfMonth = new Date(y, m, 0, 23, 59, 59); // последний день выбранного месяца
    balanceRecords = allRecords.filter(r => r.date <= endOfMonth);
  }
  const overallBalance = balanceRecords.filter(r => r.type === 'Доход').reduce((s,r) => s+r.amount, 0)
                        - balanceRecords.filter(r => r.type === 'Расход').reduce((s,r) => s+r.amount, 0);

  renderStats(filtered, overallBalance);
  renderPie(filtered);
  renderBar(filtered);
  renderLine(allRecords, selected);
  renderTable(filtered);
}

function renderStats(records, overallBalance) {
  const income = records.filter(r => r.type === 'Доход').reduce((s,r) => s+r.amount, 0);
  const expense = records.filter(r => r.type === 'Расход').reduce((s,r) => s+r.amount, 0);

  const grid = document.getElementById('statsGrid');
  grid.innerHTML = `
    <div class="stat"><div class="label">Доход за месяц</div><div class="value pos">${income.toFixed(0)}</div></div>
    <div class="stat"><div class="label">Расход за месяц</div><div class="value neg">${expense.toFixed(0)}</div></div>
    <div class="stat"><div class="label">Общий баланс</div><div class="value ${overallBalance>=0?'pos':'neg'}">${overallBalance.toFixed(0)}</div></div>
    <div class="stat"><div class="label">Записей</div><div class="value">${records.length}</div></div>
  `;
}

function destroyChart(id) { if (charts[id]) charts[id].destroy(); }

function palette(n) {
  const colors = ['#7fae52','#c9a04a','#b8563f','#5a7a9e','#8b6bab','#4f9e8f','#c98a4a','#9e5a7a'];
  return Array.from({length:n}, (_,i) => colors[i % colors.length]);
}

function renderPie(records) {
  const expenses = records.filter(r => r.type === 'Расход');
  const byCategory = {};
  expenses.forEach(r => { byCategory[r.category] = (byCategory[r.category]||0) + r.amount; });
  const labels = Object.keys(byCategory);
  const data = Object.values(byCategory);

  destroyChart('pie');
  charts.pie = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: palette(labels.length), borderColor: '#14170f', borderWidth: 2 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { color: '#e8e6d9', font: { family: 'Courier New', size: 11 } } } }
    }
  });
}

function dayKey(d) { return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit' }); }

function renderBar(records) {
  const days = {};
  records.forEach(r => {
    const k = dayKey(r.date);
    if (!days[k]) days[k] = { income: 0, expense: 0 };
    if (r.type === 'Доход') days[k].income += r.amount;
    else days[k].expense += r.amount;
  });
  const labels = Object.keys(days);

  destroyChart('bar');
  charts.bar = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Доход', data: labels.map(l => days[l].income), backgroundColor: '#7fae52' },
        { label: 'Расход', data: labels.map(l => days[l].expense), backgroundColor: '#b8563f' }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { ticks: { color: '#8b8f7a', font: { family: 'Courier New', size: 10 } }, grid: { color: '#2a2f22' } },
        y: { ticks: { color: '#8b8f7a', font: { family: 'Courier New', size: 10 } }, grid: { color: '#2a2f22' } }
      },
      plugins: { legend: { labels: { color: '#e8e6d9', font: { family: 'Courier New', size: 11 } } } }
    }
  });
}

function renderLine(allRecordsSorted, selectedMonth) {
  // Считаем накопительный баланс по ВСЕЙ истории, день за днём, по порядку
  const dayOrder = [];
  const dayTotals = {};
  allRecordsSorted.forEach(r => {
    const k = dayKey(r.date);
    const fullKey = r.date.getFullYear() + '-' + String(r.date.getMonth()+1).padStart(2,'0') + '-' + k;
    if (!dayTotals[fullKey]) { dayTotals[fullKey] = 0; dayOrder.push(fullKey); }
    dayTotals[fullKey] += (r.type === 'Доход' ? r.amount : -r.amount);
  });

  let running = 0;
  const fullSeries = dayOrder.map(k => {
    running += dayTotals[k];
    const label = k.slice(8,10) + '.' + k.slice(5,7);
    return { key: k, label, value: running };
  });

  // Если выбран конкретный месяц — показываем только его отрезок, но со значениями, накопленными с начала истории
  const visible = selectedMonth === 'all'
    ? fullSeries
    : fullSeries.filter(p => p.key.slice(0,7) === selectedMonth);

  destroyChart('line');
  charts.line = new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: { labels: visible.map(p => p.label), datasets: [{ label: 'Баланс', data: visible.map(p => p.value), borderColor: '#c9a04a', backgroundColor: 'rgba(201,160,74,0.15)', fill: true, tension: 0.2 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { ticks: { color: '#8b8f7a', font: { family: 'Courier New', size: 10 } }, grid: { color: '#2a2f22' } },
        y: { ticks: { color: '#8b8f7a', font: { family: 'Courier New', size: 10 } }, grid: { color: '#2a2f22' } }
      },
      plugins: { legend: { labels: { color: '#e8e6d9', font: { family: 'Courier New', size: 11 } } } }
    }
  });
}

function renderTable(records) {
  const tbody = document.getElementById('recordsBody');
  tbody.innerHTML = records.slice().reverse().map(r => `
    <tr>
      <td>${r.dateRaw}</td>
      <td>${r.type}</td>
      <td class="${r.type==='Расход'?'amount-neg':'amount-pos'}">${r.type==='Расход'?'-':'+'}${r.amount}</td>
      <td>${r.category}</td>
      <td>${r.comment}</td>
    </tr>
  `).join('');
}

function clearData() {
  document.getElementById('rawInput').value = '';
  localStorage_safe_set('');
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('content').style.display = 'none';
  document.getElementById('statsGrid').innerHTML = '';
}
</script>

</body>
</html>
